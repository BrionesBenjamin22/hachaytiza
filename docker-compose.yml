x-logging: &logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  web:
    image: hyt-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Configure NEXT_PUBLIC_API_URL before building}
        NEXT_PUBLIC_SESSION_WARNING_SECONDS: ${NEXT_PUBLIC_SESSION_WARNING_SECONDS:-120}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    networks: [app_network]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    init: true
    pids_limit: ${WEB_PIDS_LIMIT:-512}
    mem_limit: ${WEB_MEMORY_LIMIT:-1g}
    cpus: ${WEB_CPU_LIMIT:-1.0}
    stop_grace_period: 30s
    restart: "on-failure:5"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  api:
    image: hyt-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Configure DOCKER_DATABASE_URL using db as hostname}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      CSRF_SECRET: ${CSRF_SECRET:?Configure CSRF_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:?Configure FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:?Configure CORS_ORIGINS}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3001}:3001"
    networks: [app_network, db_network]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    init: true
    pids_limit: ${API_PIDS_LIMIT:-512}
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    cpus: ${API_CPU_LIMIT:-1.0}
    stop_grace_period: 30s
    restart: "on-failure:5"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hyt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hyt}
    volumes:
      - hyt-postgres:/var/lib/postgresql/data
    networks: [db_network]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    init: true
    pids_limit: ${DB_PIDS_LIMIT:-256}
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    cpus: ${DB_CPU_LIMIT:-2.0}
    stop_grace_period: 30s
    restart: "on-failure:5"
    logging: *logging

networks:
  app_network:
  db_network:
    internal: true

volumes:
  hyt-postgres:
